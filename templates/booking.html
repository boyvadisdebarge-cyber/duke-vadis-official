{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking | Duke Vadis</title><link rel="stylesheet" href="{% static 'site.css' %}"></head><body><nav class="nav"><a class="brand" href="{% url 'home' %}">DUKE <span>VADIS</span></a><a href="{% url 'home' %}">← Back home</a></nav><main class="booking"><p class="eyebrow">INVITATIONS & ENQUIRIES</p><h1>Book Duke Vadis</h1><p>Tell us a little about your event and we’ll be in touch.</p>{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<label>Your name<input name="name" required maxlength="120"></label><label>Email address<input type="email" name="email" required></label><label>Phone number<input name="phone"></label><label>Church or organisation<input name="organisation"></label><label>Event date<input type="date" name="event_date"></label><label>Event location<input name="event_location"></label><label>Tell us about the event<textarea name="message" rows="5" required></textarea></label><button class="btn gold" type="submit">Send booking enquiry</button></form></main><footer>© {% now "Y" %} Duke Vadis</footer></body></html>
